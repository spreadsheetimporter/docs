site_name: Spreadsheet Importer
site_url: https://docs.spreadsheet-importer.com/
site_description: >-
  Documentation for the Spreadsheet Importer — the UI5 frontend custom control
  and the server-side ABAP RAP backend importer.
repo_name: spreadsheetimporter/docs
repo_url: https://github.com/spreadsheetimporter/docs
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site

nav:
  - Home: index.md
  - Getting Started: ui5/pages/GettingStarted.md
  - Core Concepts:
      - How it works: ui5/pages/HowItWorks.md
      - Configuration: ui5/pages/Configuration.md
      - Null & Empty Values: ui5/pages/NullHandling.md
      - Events: ui5/pages/Events.md
      - Error Handling: ui5/pages/Checks.md
  - Features:
      - Using UPDATE: ui5/pages/Update.md
      - Button Control: ui5/pages/Button.md
      - Deep Download: ui5/pages/spreadsheetdownload.md
      - CAP CDS Plugin: ui5/pages/CdsPlugin.md
      - Table Selector: ui5/pages/TableSelector.md
      - Wizard: ui5/pages/Wizard.md
  - Integration:
      - TypeScript: ui5/pages/Typescript.md
      - Central Deployment: ui5/pages/CentralDeployment.md
      - Supported Versions: ui5/pages/SupportVersions.md
  - ABAP (Backend Importer):
      - Overview: abap/index.md
      - Integration Guide: abap/integration-guide.md
      - Fiori Elements & File Upload: abap/fiori-elements.md
      - Options & Data Types: abap/options.md
      - Extension Hooks: abap/extension-hooks.md
      - Template Download: abap/template-download.md
      - Troubleshooting & Limits: abap/troubleshooting.md
      - Public API Contract: abap/public-api-contract.md
      - Usage Cookbook: abap/usage-cookbook.md
  - Reference:
      - API Reference: ui5/pages/APIReference.md
      - Changelogs: ui5/pages/CHANGELOGSPREADSHEETIMPORTER.md
      - Troubleshooting: ui5/pages/Troubleshooting.md
  - Resources:
      - User Documentation: ui5/pages/UserDocumentation.md
      - Use Cases: ui5/pages/UseCases.md
  - Development:
      - Getting Started: ui5/pages/Development/GettingStarted.md
      - Project setup: ui5/pages/Development/ProjectSetup.md
      - OData V2 export and update: ui5/pages/Development/ODataV2-ExportAndUpdate.md
      - Testing:
          - wdi5 Tests: ui5/pages/Development/wdi5.md
          - OPA5 Tests: ui5/pages/Development/opa5.md
      - Documentation: ui5/pages/Development/Docs.md
      - Prettier & Commit Linting: ui5/pages/Development/PrettierAndCommitlint.md
      - GitHub Actions: ui5/pages/Development/GitHubActions.md
      - Sample Apps: ui5/pages/Development/SampleApps.md
      - Spreadsheet Download: ui5/pages/Development/SpreadsheetDownload.md

# Pages intentionally built but kept out of the sidebar (as in the original UI5 docs).
not_in_nav: |
  /ui5/pages/Pro/
  /ui5/pages/Development/Update.md

theme:
  name: material
  custom_dir: docs/ui5/overrides
  palette:
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  logo: ui5/images/Logo_square.png
  favicon: ui5/images/Logo_square.png
  font: false
  features:
    - navigation.expand
    - content.code.copy
    - palette.switch

extra_css:
  - ui5/stylesheets/extra.css

extra_javascript:
  - javascripts/nav-collapse.js

plugins:
  - search
  - redirects:
      redirect_maps:
        pages/APIReference.md: ui5/pages/APIReference.md
        pages/Button.md: ui5/pages/Button.md
        pages/CHANGELOGSPREADSHEETIMPORTER.md: ui5/pages/CHANGELOGSPREADSHEETIMPORTER.md
        pages/CdsPlugin.md: ui5/pages/CdsPlugin.md
        pages/CentralDeployment.md: ui5/pages/CentralDeployment.md
        pages/Checks.md: ui5/pages/Checks.md
        pages/Configuration.md: ui5/pages/Configuration.md
        pages/Development/Docs.md: ui5/pages/Development/Docs.md
        pages/Development/GettingStarted.md: ui5/pages/Development/GettingStarted.md
        pages/Development/GitHubActions.md: ui5/pages/Development/GitHubActions.md
        pages/Development/ODataV2-ExportAndUpdate.md: ui5/pages/Development/ODataV2-ExportAndUpdate.md
        pages/Development/PrettierAndCommitlint.md: ui5/pages/Development/PrettierAndCommitlint.md
        pages/Development/ProjectSetup.md: ui5/pages/Development/ProjectSetup.md
        pages/Development/SampleApps.md: ui5/pages/Development/SampleApps.md
        pages/Development/SpreadsheetDownload.md: ui5/pages/Development/SpreadsheetDownload.md
        pages/Development/Update.md: ui5/pages/Development/Update.md
        pages/Development/opa5.md: ui5/pages/Development/opa5.md
        pages/Development/wdi5.md: ui5/pages/Development/wdi5.md
        pages/Events.md: ui5/pages/Events.md
        pages/GettingStarted.md: ui5/pages/GettingStarted.md
        pages/HowItWorks.md: ui5/pages/HowItWorks.md
        pages/NullHandling.md: ui5/pages/NullHandling.md
        pages/Pro/deepcreate.md: ui5/pages/Pro/deepcreate.md
        pages/Pro/install.md: ui5/pages/Pro/install.md
        pages/SupportVersions.md: ui5/pages/SupportVersions.md
        pages/TableSelector.md: ui5/pages/TableSelector.md
        pages/Troubleshooting.md: ui5/pages/Troubleshooting.md
        pages/Typescript.md: ui5/pages/Typescript.md
        pages/Update.md: ui5/pages/Update.md
        pages/UseCases.md: ui5/pages/UseCases.md
        pages/UserDocumentation.md: ui5/pages/UserDocumentation.md
        pages/Wizard.md: ui5/pages/Wizard.md
        pages/spreadsheetdownload.md: ui5/pages/spreadsheetdownload.md
  - minify:
      minify_html: true

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - attr_list
  - md_in_html
  - tables
  - codehilite:
      guess_lang: false
  - toc:
      permalink: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.keys
  - pymdownx.smartsymbols
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.caret
  - pymdownx.snippets
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
